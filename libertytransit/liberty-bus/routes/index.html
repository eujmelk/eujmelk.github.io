<html>
<body>
<div id="route-diagram" style="overflow-x:auto; border:1px solid #ddd; border-radius:8px;"></div>

<script>
async function renderPearlDiagram(container, url) {
  const data = await (await fetch(url)).json();

  const stops = data.stops;
  const color = data.route.color || "#222";
  const maxLabelLen = Math.max(...stops.map(s => (s.name || "").length), 1);

  const clamp = (a, x, b) => Math.max(a, Math.min(x, b));
  const spacing = clamp(90, 18 * maxLabelLen, 180);

  const padL = 40, padR = 40;
  const yLine = 70;
  const pearlR = 8;

  const width = padL + padR + (stops.length - 1) * spacing;
  const height = 140;

  const segStyle = new Map();
  (data.segments || []).forEach(s => {
    segStyle.set(`${s.from}__${s.to}`, s.style);
  });

  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  // Base line
  const base = document.createElementNS(ns, "line");
  base.setAttribute("x1", padL);
  base.setAttribute("x2", width - padR);
  base.setAttribute("y1", yLine);
  base.setAttribute("y2", yLine);
  base.setAttribute("stroke", color);
  base.setAttribute("stroke-width", 6);
  base.setAttribute("stroke-linecap", "round");
  svg.appendChild(base);

  // Helper to get x for stop index
  const xOf = (i) => padL + i * spacing;

  // Segment overlays (dotted/dashed)
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    const style = segStyle.get(`${a.id}__${b.id}`) || "solid";
    if (style === "solid") continue;

    const seg = document.createElementNS(ns, "line");
    seg.setAttribute("x1", xOf(i));
    seg.setAttribute("x2", xOf(i + 1));
    seg.setAttribute("y1", yLine);
    seg.setAttribute("y2", yLine);
    seg.setAttribute("stroke", color);
    seg.setAttribute("stroke-width", 6);
    seg.setAttribute("stroke-linecap", "round");

    if (style === "dotted") seg.setAttribute("stroke-dasharray", "1 10");
    if (style === "dashed") seg.setAttribute("stroke-dasharray", "10 10");

    svg.appendChild(seg);
  }

  // Pearls + labels
  stops.forEach((s, i) => {
    const x = xOf(i);

    // Pearl base
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", x);
    c.setAttribute("cy", yLine);
    c.setAttribute("r", pearlR);
    c.setAttribute("fill", "#fff");
    c.setAttribute("stroke", color);
    c.setAttribute("stroke-width", 4);
    svg.appendChild(c);

    // Hub ring
    if (s.type === "hub") {
      const ring = document.createElementNS(ns, "circle");
      ring.setAttribute("cx", x);
      ring.setAttribute("cy", yLine);
      ring.setAttribute("r", pearlR + 6);
      ring.setAttribute("fill", "none");
      ring.setAttribute("stroke", color);
      ring.setAttribute("stroke-width", 3);
      svg.appendChild(ring);
    }

    // Airport marker (simple triangle "plane-ish" placeholder)
    if (s.type === "airport") {
      const tri = document.createElementNS(ns, "path");
      tri.setAttribute("d", `M ${x} ${yLine-26} l 8 14 h -16 z`);
      tri.setAttribute("fill", color);
      svg.appendChild(tri);
    }

    // Label (rotated above)
    const t = document.createElementNS(ns, "text");
    t.textContent = s.name || "";
    t.setAttribute("x", x);
    t.setAttribute("y", yLine - 14);
    t.setAttribute("font-size", "12");
    t.setAttribute("font-family", "system-ui, -apple-system, Segoe UI, Roboto, Arial");
    t.setAttribute("fill", "#111");
    t.setAttribute("text-anchor", "start");
    t.setAttribute("transform", `rotate(-35 ${x} ${yLine - 14}) translate(6 0)`);
    svg.appendChild(t);

    // Transfers badge (optional)
    if (Array.isArray(s.transfers) && s.transfers.length) {
      const badge = document.createElementNS(ns, "text");
      badge.textContent = "⇄";
      badge.setAttribute("x", x);
      badge.setAttribute("y", yLine + 28);
      badge.setAttribute("text-anchor", "middle");
      badge.setAttribute("font-size", "14");
      badge.setAttribute("fill", color);
      svg.appendChild(badge);
    }
  });

  container.innerHTML = "";
  container.appendChild(svg);
}

renderPearlDiagram(document.getElementById("route-diagram"), "/routes/211.json");
</script>

</body>
</html>
