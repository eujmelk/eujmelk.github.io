---
layout: default
---
<p class="lede">{{ content }}</p>

{% assign coll = site[page.collection] | sort: "route_no" %}
<div class="route-list">
  {% for r in coll %}
    <a class="route-row" href="{{ r.url }}">
      <span class="route-no">{{ r.route_no }}</span>
      <span class="route-name">{{ r.title }}</span>
      {% if r.summary %}<span class="route-summary">{{ r.summary }}</span>{% endif %}
    </a>
  {% endfor %}
</div>
